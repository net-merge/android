name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum
      - name: Vet and test
        working-directory: golib
        run: |
          go vet ./...
          go test -race ./...

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: golib/go.mod
          cache-dependency-path: golib/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Go engine (gomobile)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-go.sh
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/
          cp app/build/outputs/apk/release/app-release.apk out/net-merge-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

  # Real screenshots for the README, taken on an emulator that has both Wi-Fi and mobile data.
  screenshots:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/screenshots.sh out/app-debug.apk docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
